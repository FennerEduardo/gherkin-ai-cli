<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gherkin AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; }
        .code-bg { background-color: #1e293b; color: #38bdf8; font-family: monospace; }
        .gradient-text { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6">
    <header class="flex justify-between items-center mb-8 glass-panel p-4 px-6 shadow-lg">
        <h1 class="text-2xl font-bold gradient-text flex items-center gap-3">
            <i class="fa-solid fa-robot"></i> Gherkin AI Studio
        </h1>
        <div id="stack-badge" class="hidden items-center gap-2 px-3 py-1 bg-indigo-900/50 text-indigo-200 border border-indigo-700/50 rounded-full text-sm font-medium">
            <i class="fa-solid fa-layer-group"></i> <span id="stack-name">Detecting...</span>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Editor Section -->
        <section class="glass-panel p-6 flex flex-col shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-sky-400 border-b border-slate-700 pb-2"><i class="fa-regular fa-file-code"></i> Feature Specification</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-400 mb-1">Feature Name</label>
                <input type="text" id="feature-name" placeholder="e.g. User Authentication" class="w-full bg-slate-800 border border-slate-600 rounded-md p-2 text-white focus:outline-none focus:ring-2 focus:ring-sky-500">
            </div>
            <div class="flex-1 flex flex-col">
                <label class="block text-sm font-medium text-slate-400 mb-1">Gherkin Scenarios</label>
                <textarea id="gherkin-text" class="w-full flex-1 min-h-[300px] bg-slate-900 border border-slate-700 rounded-md p-4 text-sky-100 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="Feature: Example Feature&#10;&#10;  Scenario: Successful login&#10;    Given the user is on the login page&#10;    When they enter valid credentials&#10;    Then they should be redirected to the dashboard"></textarea>
            </div>
            <button id="generate-btn" class="mt-6 w-full py-3 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-lg shadow-lg shadow-sky-500/20 transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate AI Agents & Contracts
            </button>
        </section>

        <!-- Results Section -->
        <section class="glass-panel p-6 flex flex-col shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-indigo-400 border-b border-slate-700 pb-2"><i class="fa-solid fa-microchip"></i> Generation Results</h2>
            
            <div id="loading" class="hidden flex-1 flex flex-col justify-center items-center text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-sky-500"></i>
                <p>Orchestrating agents and generating code...</p>
            </div>

            <div id="results-empty" class="flex-1 flex flex-col justify-center items-center text-slate-500 text-center p-8">
                <i class="fa-regular fa-folder-open text-6xl mb-4 opacity-50"></i>
                <p>Waiting for Gherkin specification.<br>Click Generate to see the results here.</p>
            </div>

            <div id="results-content" class="hidden flex-1 flex flex-col gap-4 overflow-y-auto pr-2">
                <div class="bg-emerald-900/30 border border-emerald-700/50 text-emerald-200 p-4 rounded-lg flex items-start gap-3">
                    <i class="fa-solid fa-check-circle mt-1"></i>
                    <div>
                        <p class="font-bold">Generation Successful!</p>
                        <p class="text-sm opacity-80" id="success-path">Files saved to ./generated-specs/</p>
                    </div>
                </div>

                <h3 class="font-semibold text-slate-300 mt-2">Generated Files:</h3>
                <div id="file-list" class="flex flex-col gap-2">
                    <!-- Files injected via JS -->
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Fetch detected stack
            try {
                const res = await fetch('/api/stack');
                const data = await res.json();
                if (data.success) {
                    const cfg = data.config;
                    document.getElementById('stack-name').textContent = `${cfg.architecture.toUpperCase()} | ${cfg.stack.language} (${cfg.stack.framework})`;
                    document.getElementById('stack-badge').classList.remove('hidden');
                    document.getElementById('stack-badge').classList.add('flex');
                }
            } catch (err) {
                console.error("Failed to fetch stack", err);
            }

            // Handle Generate Button
            document.getElementById('generate-btn').addEventListener('click', async () => {
                const featureName = document.getElementById('feature-name').value;
                const gherkinText = document.getElementById('gherkin-text').value;

                if (!gherkinText.trim()) {
                    alert("Please write some Gherkin scenarios first.");
                    return;
                }

                // UI State
                document.getElementById('results-empty').classList.add('hidden');
                document.getElementById('results-content').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');
                document.getElementById('loading').classList.add('flex');
                document.getElementById('generate-btn').disabled = true;

                try {
                    const res = await fetch('/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ featureName, gherkinText })
                    });
                    const data = await res.json();

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('loading').classList.remove('flex');

                    if (data.success) {
                        document.getElementById('results-content').classList.remove('hidden');
                        document.getElementById('results-content').classList.add('flex');
                        document.getElementById('success-path').textContent = `Saved to: ${data.outDir}`;

                        const fileList = document.getElementById('file-list');
                        fileList.innerHTML = '';
                        Object.keys(data.files).forEach(filename => {
                            const div = document.createElement('div');
                            const isMd = filename.endsWith('.md');
                            div.className = 'bg-slate-800 border border-slate-700 rounded p-3 text-sm flex justify-between items-center';
                            div.innerHTML = `
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid ${isMd ? 'fa-file-lines text-sky-400' : 'fa-code text-amber-400'}"></i>
                                    <span class="font-mono">${filename}</span>
                                </div>
                                <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">Generated</span>
                            `;
                            fileList.appendChild(div);
                        });
                    } else {
                        alert("Error generating specs: " + data.error);
                        document.getElementById('results-empty').classList.remove('hidden');
                        document.getElementById('results-empty').classList.add('flex');
                    }
                } catch (err) {
                    alert("Network error: " + err.message);
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('loading').classList.remove('flex');
                    document.getElementById('results-empty').classList.remove('hidden');
                    document.getElementById('results-empty').classList.add('flex');
                } finally {
                    document.getElementById('generate-btn').disabled = false;
                }
            });
        });
    </script>
</body>
</html>
