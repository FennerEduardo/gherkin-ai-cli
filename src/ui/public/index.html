<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gherkin AI - Observability Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --sidebar-width: 280px;
            --accent: #10b981;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 0;
            z-index: 10;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            padding: 0 1.5rem 2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 1rem;
        }

        .logo span {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-item {
            padding: 0.875rem 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-item:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            color: var(--text-main);
            background: rgba(59, 130, 246, 0.1);
            border-right: 3px solid var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header {
            padding: 1.5rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Views */
        .view {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards and Lists */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: rgba(59, 130, 246, 0.5);
        }

        .glass-card h3 {
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .glass-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Code Viewer */
        .code-viewer-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 150px);
            background: #0d1117;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
        }

        .code-viewer-header {
            background: #161b22;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-viewer-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #8b949e;
        }

        .code-content {
            flex: 1;
            padding: 1.5rem;
            overflow: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.6;
            color: #c9d1d9;
            white-space: pre-wrap;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { background: var(--primary-hover); }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            margin-top: 0.5rem;
        }

        .log-entry {
            background: var(--glass-bg);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
        }

        .log-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .log-action {
            font-size: 1.05rem;
            color: var(--text-main);
        }

        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #codeViewerModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 50;
            padding: 2rem;
        }
        #codeViewerModal.active { display: flex; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            🥒 <span>Gherkin AI</span>
        </div>
        <div class="nav-item active" onclick="switchView('features')">📝 Features</div>
        <div class="nav-item" onclick="switchView('prompts')">🤖 Agents & Prompts</div>
        <div class="nav-item" onclick="switchView('contracts')">📜 Contracts & Config</div>
        <div class="nav-item" onclick="switchView('logs')">🕵️ Agent Logs</div>
        <div class="nav-item" onclick="switchView('inventory')">📦 Audit Inventory</div>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1 id="viewTitle">Observability Dashboard</h1>
            <div id="statusIndicator">🟢 Connected</div>
        </header>

        <section class="content-area">
            
            <!-- Features View -->
            <div id="features" class="view active">
                <div class="grid-container" id="featuresGrid">
                    <div class="loader"></div>
                </div>
            </div>

            <!-- Prompts View -->
            <div id="prompts" class="view">
                <div class="grid-container" id="promptsGrid"></div>
            </div>

            <!-- Contracts View -->
            <div id="contracts" class="view">
                <div class="grid-container" id="contractsGrid"></div>
            </div>

            <!-- Agent Logs View -->
            <div id="logs" class="view">
                <div id="logsList"></div>
            </div>

            <!-- Inventory View -->
            <div id="inventory" class="view">
                <div class="grid-container" id="inventoryGrid"></div>
            </div>

        </section>
    </main>

    <!-- Code Viewer Modal -->
    <div id="codeViewerModal">
        <div class="code-viewer-container" style="width: 100%; max-width: 1200px; margin: auto;">
            <div class="code-viewer-header">
                <div class="code-viewer-title" id="modalTitle">filename.ts</div>
                <button class="btn" onclick="closeModal()">Close</button>
            </div>
            <div class="code-content" id="modalContent"></div>
        </div>
    </div>

    <script>
        const API = {
            async fetch(endpoint) {
                try {
                    const res = await fetch(endpoint);
                    if (!res.ok) throw new Error('Network error');
                    return await res.json();
                } catch (e) {
                    console.error(e);
                    return null;
                }
            }
        };

        // Navigation
        function switchView(viewId) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');

            const titles = {
                'features': '📝 Feature Specifications',
                'prompts': '🤖 Agent Master Prompts',
                'contracts': '📜 Domain Contracts & Architecture',
                'logs': '🕵️ AI Agent Action Walkthroughs',
                'inventory': '📦 Execution Audit Inventory'
            };
            document.getElementById('viewTitle').innerText = titles[viewId];

            loadDataForView(viewId);
        }

        // Modals
        function openModal(title, content) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').textContent = content; // textContent for raw code
            document.getElementById('codeViewerModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('codeViewerModal').classList.remove('active');
        }

        // Data Loaders
        async function loadDataForView(viewId) {
            if (viewId === 'features') await loadFeatures();
            if (viewId === 'prompts') await loadPrompts();
            if (viewId === 'contracts') await loadContracts();
            if (viewId === 'logs') await loadLogs();
            if (viewId === 'inventory') await loadInventory();
        }

        async function loadFeatures() {
            const data = await API.fetch('/api/features');
            const grid = document.getElementById('featuresGrid');
            if (!data || !data.features || data.features.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">No features found in the workspace.</p>';
                return;
            }
            
            grid.innerHTML = data.features.map(f => `
                <div class="glass-card" onclick="viewFeature('${f}')">
                    <h3>${f}</h3>
                    <p>Behavior Driven Development Specification</p>
                    <span class="badge">BDD</span>
                </div>
            `).join('');
        }

        async function viewFeature(name) {
            const data = await API.fetch('/api/features/' + name);
            if (data && data.content) {
                openModal(name, data.content);
            }
        }

        async function loadPrompts() {
            const data = await API.fetch('/api/prompts');
            const grid = document.getElementById('promptsGrid');
            if (!data || !data.prompts || data.prompts.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">No generated prompts found.</p>';
                return;
            }
            
            grid.innerHTML = data.prompts.map((p, i) => `
                <div class="glass-card" onclick="openModal('${p.filename}', promptsData[${i}].content)">
                    <h3>${p.filename}</h3>
                    <p>Agent Context & Instructions</p>
                    <span class="badge">Markdown</span>
                </div>
            `).join('');
            window.promptsData = data.prompts; // Store for modal access
        }

        async function loadContracts() {
            const data = await API.fetch('/api/contracts');
            const grid = document.getElementById('contractsGrid');
            if (!data || !data.contracts || data.contracts.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">No contracts found.</p>';
                return;
            }
            
            grid.innerHTML = data.contracts.map((c, i) => `
                <div class="glass-card" onclick="openModal('${c.filename}', contractsData[${i}].content)">
                    <h3>${c.filename}</h3>
                    <p>Generated Architecture Artifact</p>
                    <span class="badge">Contract</span>
                </div>
            `).join('');
            window.contractsData = data.contracts;

            // Load Governance too
            const govData = await API.fetch('/api/governance');
            if (govData && govData.content) {
                grid.innerHTML += `
                    <div class="glass-card" onclick="openModal('.ghkgovernance.yaml', \`${govData.content.replace(/`/g, '\\`')}\`)">
                        <h3>.ghkgovernance.yaml</h3>
                        <p>Agent Guardrails & Architecture Policy</p>
                        <span class="badge" style="background:rgba(16,185,129,0.2);color:#10b981;">Governance</span>
                    </div>
                `;
            }
        }

        async function loadLogs() {
            const data = await API.fetch('/api/agent-logs');
            const list = document.getElementById('logsList');
            if (!data || !data.logs || data.logs.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted)">No AI agent action logs found.</p>';
                return;
            }
            
            list.innerHTML = data.logs.map(log => `
                <div class="log-entry">
                    <div class="log-meta">${new Date(log.timestamp).toLocaleString()} • Feature: <b>${log.featureName}</b> • Agent: ${log.agentId.name}</div>
                    <div class="log-action">↳ ${log.action}</div>
                </div>
            `).join('');
        }

        async function loadInventory() {
            const data = await API.fetch('/api/inventory');
            const grid = document.getElementById('inventoryGrid');
            if (!data || !data.inventory || data.inventory.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted)">No execution audit inventory found.</p>';
                return;
            }
            
            grid.innerHTML = data.inventory.map(inv => `
                <div class="glass-card" onclick="openModal('Audit Record: ${inv.recordId}', JSON.stringify(inventoryData.find(i=>i.recordId==='${inv.recordId}'), null, 2))">
                    <h3>${inv.featureName}</h3>
                    <p style="font-family:'Fira Code',monospace; font-size:0.8rem; margin:0.5rem 0;">ID: ${inv.recordId}</p>
                    <p>Cmd: <code>${inv.command}</code></p>
                    <span class="badge">vHash: ${inv.featureVersionHash}</span>
                </div>
            `).join('');
            window.inventoryData = data.inventory;
        }

        // Initialize
        loadFeatures();

        // Close modal on outside click
        document.getElementById('codeViewerModal').addEventListener('click', (e) => {
            if (e.target.id === 'codeViewerModal') closeModal();
        });
    </script>
</body>
</html>
