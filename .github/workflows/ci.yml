name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Builds dist/ (used by the CLI contract tests) and regenerates schemas/config.schema.json.
      - name: Build
        run: npm run build

      - name: Config JSON Schema is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: git diff --exit-code -- schemas/config.schema.json

      - name: Unit, integration and CLI contract tests (with coverage thresholds)
        run: npx vitest run --coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Dependency audit (blocking)
        run: npm audit --audit-level=high
      - name: Package contents (no secrets, no stray files)
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const files=require('./pack.json')[0].files.map(f=>f.path); const bad=files.filter(f=>/(^|\/)(\.env|auth\.json|.*\.pem|.*\.key)$/.test(f)); if(bad.length){console.error('Forbidden files in package:',bad);process.exit(1)} console.log(files.length+' files OK')"

  golden-builds:
    # Generated code for every STABLE stack must compile (see docs/ENTERPRISE.md, "Stack support tiers").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm run build
      - name: Generate and compile stable stacks (NestJS, .NET)
        run: node scripts/golden-build.js
